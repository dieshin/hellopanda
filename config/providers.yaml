version: 1
context:
  enabled: false
  aggregation: maximum
  entries: []
threat_intelligence:
  enabled: false
  timeout_seconds: 10
  cache_seconds: 3600
  max_queries_per_analysis: 12
  shared_reputation_cap: 30
  sources:
    virustotal:
      enabled: true
      url: https://www.virustotal.com/api/v3/ip_addresses/{ip}
      api_key_env: VIRUSTOTAL_API_KEY
      key_header: x-apikey
      positive_score: 70
      max_response_bytes: 1048576
    abuseipdb:
      enabled: true
      url: https://api.abuseipdb.com/api/v2/check
      api_key_env: ABUSEIPDB_API_KEY
      key_header: Key
      positive_score: 70
      max_response_bytes: 1048576
      max_age_days: 30
    urlhaus:
      enabled: true
      url: https://urlhaus-api.abuse.ch/v1/host/
      api_key_env: URLHAUS_AUTH_KEY
      key_header: Auth-Key
      positive_score: 70
      max_response_bytes: 1048576
    greynoise:
      enabled: true
      url: https://api.greynoise.io/v3/community/{ip}
      api_key_env: GREYNOISE_API_KEY
      key_header: key
      positive_score: 70
      max_response_bytes: 1048576
hosting:
  enabled: true
  timeout_seconds: 15
  max_response_bytes: 10485760
  max_age_seconds: 604800
  feeds:
  - name: Cloudflare
    url: https://www.cloudflare.com/ips-v4
    format: cidr
    shared_infrastructure: true
  - name: Cloudflare
    url: https://www.cloudflare.com/ips-v6
    format: cidr
    shared_infrastructure: true
  - name: AWS
    url: https://ip-ranges.amazonaws.com/ip-ranges.json
    format: aws
    shared_infrastructure: false
